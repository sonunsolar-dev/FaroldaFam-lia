<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#0d2f3a" name="theme-color"/>
<title>Como criar uma rede de apoio para um idoso — SOS FAROL</title>
<meta name="robots" content="noindex,follow">
<link href="../assets/logo-sos-farol.webp" rel="icon" type="image/webp"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0d2f3a;--navy-2:#123f4d;--ink:#10242c;--muted:#66777e;--soft:#f4f7f7;--white:#ffffff;--accent:#ff7a45;--accent-2:#ff9a6f;--line:#dfe7e8;--radius:22px;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--soft);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--navy);text-decoration:none}
  header{padding:20px 22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}
  .brand img{width:34px;height:34px;border-radius:9px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 22px}
  .card{max-width:480px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:40px 32px;box-shadow:0 18px 50px rgba(13,47,58,.08)}
  .icon{font-size:40px;margin-bottom:12px}
  h1{font-size:22px;color:var(--navy);margin:0 0 10px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:15px;margin:0 0 26px}
  .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:14px 24px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 12px 30px rgba(255,122,69,.28)}
</style>
</head>
<body>
<header><a class="brand" href="../index.html"><img src="../assets/logo-sos-farol.webp" alt=""><span>SOS FAROL</span></a></header>
<main>
  <div class="card">
    <div class="icon">🚧</div>
    <h1>Página em construção</h1>
    <p>Este guia sobre como montar uma rede de apoio ainda está sendo preparado. Volte em breve.</p>
    <a class="btn" href="../index.html">Voltar ao site</a>
  </div>
</main>
</body>
</html>

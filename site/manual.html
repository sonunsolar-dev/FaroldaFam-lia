<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E66">
<title>Manual — SOS Farol</title>
<style>
  :root{
    --ink:#10262B; --ink-soft:#3C5257;
    --paper:#F4F7F6; --paper-card:#FFFFFF;
    --teal:#0E6E66; --teal-deep:#0A4A45; --line:#E1E9E6; --radius:16px;
    --coral:#E1543E;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); line-height:1.6;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

  header.bar{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);}
  header.bar .row{max-width:760px; margin:0 auto; padding:0 22px; height:60px;
    display:flex; align-items:center; justify-content:space-between;}
  header.bar .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:17px;}
  header.bar a{font-size:13px; font-weight:600; color:var(--ink-soft); text-decoration:none;}

  .gate{max-width:440px; margin:0 auto; padding:56px 22px 80px;}
  .gate h1{font-size:22px; margin:0 0 6px;}
  .gate p{color:var(--ink-soft); font-size:14px; margin:0 0 22px;}
  .gate label{display:block; font-size:13px; font-weight:700; margin:0 0 5px;}
  .gate input{width:100%; padding:13px 14px; border:1.5px solid var(--line);
    border-radius:10px; font-size:16px; letter-spacing:1px; text-transform:uppercase;
    background:var(--paper-card); color:var(--ink);}
  .gate button{width:100%; margin-top:14px; padding:14px 18px; border:0; border-radius:11px;
    background:var(--teal); color:#fff; font-size:15px; font-weight:700; cursor:pointer;}
  .gate button:disabled{opacity:.55; cursor:default;}
  .gate .msg{font-size:14px; margin-top:16px; min-height:20px;}
  .gate .msg.err{color:var(--coral); font-weight:600;}
  .gate .note{font-size:12.5px; color:var(--ink-soft); margin-top:24px;}
  .gate a{color:var(--teal); font-weight:600;}

  #conteudo{max-width:760px; margin:0 auto; padding:0 0 40px;}
</style>
</head>
<body>
<a id="manual-top"></a>

<header class="bar">
  <div class="row">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="#0E6E66" stroke-width="2" opacity="0.55"/><circle cx="20" cy="20" r="11" stroke="#0E6E66" stroke-width="2" opacity="0.85"/><circle cx="20" cy="20" r="4.5" fill="#E1543E"/></svg>
      <span>Manual do SOS Farol</span>
    </div>
    <a href="index.html">← Site</a>
  </div>
</header>

<div class="gate" id="gate">
  <h1>Abrir o manual</h1>
  <p>O manual do SOS Farol é liberado com o <b>código de ativação</b> — o mesmo que você digita no aplicativo (<code>FAROL-…</code> ou <code>FAROLT-…</code>).</p>
  <label for="codigo">Código de ativação</label>
  <input type="text" id="codigo" placeholder="FAROL-000000" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button id="btn" type="button">Abrir manual</button>
  <div class="msg" id="msg"></div>
  <p class="note">Comprou e não sabe seu código? Veja em <a href="meu-codigo.html">"Meu código"</a>. Dúvidas: fale com o suporte pelo WhatsApp com o e-mail da compra.</p>
</div>

<main id="conteudo" hidden></main>

<script>
  var SUPABASE_URL = "https://hfjqnpmkvuclzemuamtv.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmanFucG1rdnVjbHplbXVhbXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzE5NTEsImV4cCI6MjEwMzEwNzk1MX0.xmMwQUzhbEHX19CXeG2TbMqZJnAiGLFtZXnqgtdgrGw";
  var URL_FN = SUPABASE_URL + "/functions/v1/farol-manual";

  var gate = document.getElementById('gate');
  var out  = document.getElementById('conteudo');
  var inp  = document.getElementById('codigo');
  var btn  = document.getElementById('btn');
  var msg  = document.getElementById('msg');

  function setMsg(t, err){ msg.textContent = t || ''; msg.className = 'msg' + (err ? ' err' : ''); }

  async function abrir(){
    var codigo = (inp.value || '').trim().toUpperCase();
    if(codigo.length < 6){ setMsg('Digite o código de ativação.', true); return; }
    btn.disabled = true; setMsg('Abrindo…');
    try{
      var r = await fetch(URL_FN, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ codigo: codigo })
      });
      var data; try { data = JSON.parse(await r.text()); } catch(_) { data = null; }

      if(!data || !data.ok){
        setMsg((data && data.msg) || 'Não foi possível abrir agora. Tente de novo em instantes.', true);
        btn.disabled = false;
        return;
      }
      out.innerHTML = data.html;
      gate.hidden = true;
      out.hidden = false;
      document.title = 'Manual de uso — SOS Farol';
      // volta ao topo (o link ?c= pode ter vindo com hash)
      window.scrollTo(0, 0);
    }catch(e){
      setMsg('Falha de conexão. Verifique a internet e tente de novo.', true);
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', abrir);
  inp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') abrir(); });

  // ?c= / ?codigo= vindo do app ou da página "Meu código" -> preenche e abre.
  (function(){
    try{
      var p = new URLSearchParams(location.search);
      var c = (p.get('c') || p.get('codigo') || '').trim();
      if(c){ inp.value = c.toUpperCase(); abrir(); }
    }catch(_){}
  })();
</script>
</body>
</html>

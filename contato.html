<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#0d2f3a" name="theme-color"/>
<title>Contato e suporte — SOS FAROL</title>
<meta content="Fale com o suporte do SOS FAROL. Respondemos por e-mail." name="description"/>
<link href="https://sosfarol.com.br/contato.html" rel="canonical"/>
<link href="assets/logo-sos-farol.webp" rel="icon" type="image/webp"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0d2f3a; --navy-2:#123f4d; --ink:#10242c; --muted:#66777e;
    --soft:#f4f7f7; --white:#ffffff; --accent:#ff7a45; --accent-2:#ff9a6f;
    --ok:#2a8b67; --coral:#c0392b; --line:#dfe7e8; --radius:22px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--soft);line-height:1.6}
  a{color:var(--navy);text-decoration:none}
  img{max-width:100%;display:block}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{max-width:640px;margin:0 auto;padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}
  .brand img{width:34px;height:34px;border-radius:9px}
  header a.back{font-size:13px;font-weight:700;color:var(--muted)}

  .wrap{max-width:520px;margin:0 auto;padding:44px 22px 80px}
  h1{font-size:28px;letter-spacing:-.02em;color:var(--navy);margin:0 0 8px}
  .sub{color:var(--muted);font-size:15px;margin:0 0 26px}

  .form{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:0 18px 50px rgba(13,47,58,.08)}
  label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--navy)}
  label:first-child{margin-top:0}
  input[type="text"],input[type="email"],textarea{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;background:var(--soft);color:var(--ink);font-family:inherit;resize:vertical;
  }
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:999px;padding:15px 20px;font-weight:800;font-size:15px;cursor:pointer;margin-top:20px;font-family:inherit}
  .btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 12px 30px rgba(255,122,69,.28)}
  .btn-primary:disabled{opacity:.55;cursor:default}
  .msg{font-size:14px;margin-top:14px;min-height:20px;text-align:center;color:var(--muted)}
  .msg.err{color:var(--coral);font-weight:700}
  .msg.ok{color:var(--ok);font-weight:700}
  .footnote{font-size:13px;color:var(--muted);margin-top:22px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="index.html"><img src="assets/logo-sos-farol.webp" alt=""><span>SOS FAROL</span></a>
    <a class="back" href="index.html">← Site</a>
  </div>
</header>

<div class="wrap">
  <h1>Precisa de ajuda?</h1>
  <p class="sub">A maioria das dúvidas de instalação e uso já está no manual completo, na sua área <a href="meu-codigo.html" target="_blank" rel="noopener">"Meu código"</a>. Não resolveu? Escreva pra gente.</p>

  <div class="form">
    <label for="supNome">Seu nome</label>
    <input type="text" id="supNome" placeholder="Seu nome">
    <label for="supEmail">Seu e-mail</label>
    <input type="email" id="supEmail" placeholder="Seu e-mail (é por onde respondemos)">
    <label for="supMsg">Mensagem</label>
    <textarea id="supMsg" rows="5" placeholder="Como podemos ajudar?"></textarea>
    <button class="btn btn-primary" id="supBtn" type="button">Enviar mensagem</button>
    <div class="msg" id="supStatus"></div>
  </div>

  <p class="footnote">Já tem código de ativação? <a href="manual.html">Abra o manual direto</a>.</p>
</div>

<script>
  var SUPABASE_URL = "https://hfjqnpmkvuclzemuamtv.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmanFucG1rdnVjbHplbXVhbXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzE5NTEsImV4cCI6MjEwMzEwNzk1MX0.xmMwQUzhbEHX19CXeG2TbMqZJnAiGLFtZXnqgtdgrGw";
  var SUPORTE_URL = SUPABASE_URL + "/functions/v1/farol-suporte";

  var supBtn = document.getElementById('supBtn');
  var supStatus = document.getElementById('supStatus');
  supBtn.addEventListener('click', function(){
    var nome = document.getElementById('supNome').value.trim();
    var email = document.getElementById('supEmail').value.trim();
    var msg = document.getElementById('supMsg').value.trim();
    if (!nome || email.indexOf('@') < 0 || msg.length < 5){
      supStatus.className = 'msg err';
      supStatus.textContent = "Preencha nome, um e-mail válido e a mensagem.";
      return;
    }
    supBtn.disabled = true;
    supStatus.className = 'msg';
    supStatus.textContent = "Enviando…";
    fetch(SUPORTE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ nome:nome, email:email, mensagem:msg })
    }).then(function(r){
      return r.text().then(function(txt){ return { ok:r.ok, txt:txt }; });
    }).then(function(res){
      supBtn.disabled = false;
      if (res.ok){
        supStatus.className = 'msg ok';
        supStatus.textContent = "Mensagem enviada! Respondemos no seu e-mail.";
        document.getElementById('supNome').value = "";
        document.getElementById('supEmail').value = "";
        document.getElementById('supMsg').value = "";
      } else {
        supStatus.className = 'msg err';
        supStatus.textContent = res.txt || "Não foi possível enviar agora. Tente de novo em instantes.";
      }
    }).catch(function(){
      supBtn.disabled = false;
      supStatus.className = 'msg err';
      supStatus.textContent = "Falha de conexão. Verifique a internet e tente de novo.";
    });
  });
</script>
</body>
</html>
